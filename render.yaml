services:
  # ----------------------------------------------------------------------------
  # ProcessIQ Backend (FastAPI Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: processiq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./processiq.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: LLM_PROVIDER
        value: local
      - key: LLM_MODEL
        value: local-heuristic-v1
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"

  # ----------------------------------------------------------------------------
  # ProcessIQ Frontend (React + Vite Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: processiq-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: processiq-backend
          property: host
